name: cross_site_group
model:
  name: cross_site
  width: 256
  depth: 4
  kernel_size: 7
  expansion: 4
  cross_layers: 2
  heads: 8
  feedforward: 1024
  dropout: 0.1
  cross_attention: true
  gradient_checkpointing: true
  site_dropout: 0.1
data:
  data_root: ${OIBC_DATA_ROOT:-handover 2/01_participant_dataset}
  cache_root: ${OIBC_CACHE_ROOT:-analysis/deep_learning/cache}
split:
  outer_fold: 5
  dev_start: '2025-02-01'
  dev_end: '2025-02-28'
loss:
  name: weighted_l1
  huber_delta: 0.05
group:
  enabled: true
  alpha: 1.0
  beta: 0.2
  composition_path: null
  available_at: null
training:
  phase: finetune
  device: cuda
  precision: auto
  seed: 2026
  deterministic: true
  batch_size: 2
  accumulation_steps: 4
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  learning_rate: 0.0001
  weight_decay: 0.01
  epochs: 15
  patience: 4
  min_delta: 0.0
  warmup_steps: 100
  gradient_clip: 1.0
  selection_metric: penalty_per_hour
  postprocess: train_calibrated
  save_root: ${OIBC_RUN_ROOT:-runs/deep_learning}
